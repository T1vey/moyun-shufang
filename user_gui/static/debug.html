<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>糖画坊 · 调试界面</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  /* 调试界面占位页：只留入口和返回，实际调试内容以后接到 #debug-root */
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  .bar { height: 46px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--bg-1); }
  .bar h1 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: var(--t-lg); font-weight: 600; }
  .bar .btn { text-decoration: none; }
  #debug-root { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
  .todo { max-width: 420px; padding: 24px; border: 1px dashed var(--line-2); border-radius: var(--r3); color: var(--text-2); line-height: 1.7; }
  .todo strong { display: block; margin-bottom: 6px; color: var(--sugar-hi); font-size: var(--t-lg); }
  .todo code { font-family: var(--mono); font-size: var(--t-sm); color: var(--text); }
</style>
</head>
<body>
<header class="bar">
  <h1><span class="seal">调</span>调试界面</h1>
  <a class="btn" href="/">返回屏幕</a>
</header>
<main id="debug-root">
  <div class="todo">
    <strong>调试界面待接入</strong>
    这里是占位页。调试内容做好后放进 <code>#debug-root</code>，
    或把屏幕页 <code>desktop.js</code> 里的 <code>DEBUG_URL</code> 改成别的地址。
  </div>
</main>
</body>
</html>
